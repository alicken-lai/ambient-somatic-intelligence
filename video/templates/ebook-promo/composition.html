<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ebook Promo</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    body { margin:0; background:#000; font-family:Inter,Segoe UI,Arial,sans-serif; }
    #composition { position:relative; width:1080px; height:1080px; background:linear-gradient(145deg,#0f172a,#111827); color:#f9fafb; overflow:hidden; }
    .clip { position:absolute; inset:0; display:grid; place-content:center; gap:24px; text-align:center; padding:90px; opacity:0; }
    .cover { width:340px; height:460px; margin:0 auto; border-radius:18px; background:linear-gradient(160deg,#1f2937,#111827); border:2px solid #34d399; display:grid; place-content:center; font-size:44px; font-weight:700; }
    h1 { font-size:64px; margin:0; }
    p { font-size:36px; margin:0; line-height:1.3; }
    .cta { color:#34d399; font-weight:700; }
  </style>
</head>
<body>
  <div id="composition" data-composition-id="ebook-promo" data-width="1080" data-height="1080" data-fps="30">
    <section class="clip" data-start="0" data-duration="6" data-track-index="0"><div class="cover">EBOOK</div><h1>New Release</h1></section>
    <section class="clip" data-start="6" data-duration="8" data-track-index="0"><p>Your team is busy,<br/>but output stays flat.</p></section>
    <section class="clip" data-start="14" data-duration="10" data-track-index="0"><p>Turn repeated chaos into<br/>an AI-native workflow.</p></section>
    <section class="clip" data-start="24" data-duration="10" data-track-index="0"><h1>AI 第二大腦</h1><p>用 ChatGPT 重構你的工作流程</p></section>
    <section class="clip" data-start="34" data-duration="8" data-track-index="0"><p class="cta">Build your AI-native workflow.</p></section>
  </div>
  <script>
    window.__timelines = window.__timelines || [];
    document.querySelectorAll('.clip').forEach((clip) => {
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(clip, { autoAlpha: 0, scale: 0.97 }, { autoAlpha: 1, scale: 1, duration: 0.5, ease: 'power2.out' })
        .to({}, { duration: Math.max(0.2, Number(clip.dataset.duration || 2) - 0.9) })
        .to(clip, { autoAlpha: 0, duration: 0.4, ease: 'power1.in' });
      window.__timelines.push(tl);
    });
  </script>
</body>
</html>
